name: CD mopl-api (deploy)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag 적기 (예 release-7)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply (Deploy API)
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="api_image_uri=123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/mopl-api:${{ github.event.inputs.image_tag }}"
