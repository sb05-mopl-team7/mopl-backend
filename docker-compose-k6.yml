services:
  k6:
    image: grafana/k6:latest
    container_name: mopl-k6
    working_dir: /scripts
    volumes:
      - ./k6:/scripts:ro
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["run", "smoke.js"]

