services:
  mopl-api:
    build:
      context: .
      dockerfile: mopl-api/Dockerfile
    container_name: mopl-api
    ports:
      - "8080:8080"
    env_file:
      - .docker.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge