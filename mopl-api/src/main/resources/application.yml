server:
  port: 8080

spring:
  application:
    name: mopl-api
  profiles:
    include: core
    active: dev
    group:
      dev: core-dev
      prod: core-prod
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# swagger
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    persist-authorization: true