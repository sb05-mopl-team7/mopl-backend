spring:
  config:
    activate:
      on-profile: test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  # [추가] 이메일 설정 가짜 값 (이게 없어서 에러 발생)
  mail:
    host: smtp.gmail.com
    port: 587
    username: "test@gmail.com"  # 가짜 값
    password: "testpassword"    # 가짜 값
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# [JWT 설정] (기존 내용 유지)
jwt:
  access-secret: "test_secret_key_for_access_token_must_be_32_bytes_long"
  refresh-secret: "test_secret_key_for_refresh_token_must_be_32_bytes_long"
  access-token-validity: 3600000
  refresh-token-validity: 604800000
  cookie:
    secure: false
    same-site: Lax

logging:
  level:
    root: INFO