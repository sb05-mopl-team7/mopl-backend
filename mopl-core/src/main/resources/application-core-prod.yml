spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_URL}:3306/mopldb?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST_PROD}
      port: ${REDIS_PORT}
      lettuce:
        pool:
          max-active: 150   # 동시에 유지할 최대 커넥션 수
          max-idle: 50      # 대기 상태의 최대 커넥션 수
          min-idle: 10      # 최소 대기 커넥션 수
          max-wait: 1000ms  # 커넥션을 확보하지 못했을 때 대기할 시간 (1초)

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS_PROD}

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO