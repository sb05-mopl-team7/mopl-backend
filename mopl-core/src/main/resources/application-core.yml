spring:
  config:
    import: optional:file:.env[.properties], optional:file:../.env[.properties]
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  data:
    redis:
      repositories:
        enabled: true

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}